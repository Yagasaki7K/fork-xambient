name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const manifest = require('./manifest.json');
          const pkg = require('./package.json');
          if (pkg.version !== manifest.version || process.env.RELEASE_TAG !== `v${manifest.version}`) {
            throw new Error('Release tag, manifest, and package versions must match');
          }
          NODE
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" output/x-ambient.zip
          --verify-tag --title "X Ambient $RELEASE_TAG"
          --notes-file INSTALL.md --generate-notes
