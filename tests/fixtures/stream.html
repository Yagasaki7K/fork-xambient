<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streaming player fixture</title>
  <style>
    html { color-scheme: dark; font: 16px system-ui, sans-serif; background: #11131a; color: #e8eaf2; }
    body { margin: 32px; }
    main { display: flex; align-items: flex-start; gap: 32px; }
    .player { width: 720px; max-width: 70vw; height: 450px; background: #000; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .player.small { width: 480px; height: 300px; }
    aside { width: 240px; min-height: 420px; padding: 16px; background: #20232f; }
    button, select { font: inherit; color: inherit; background: #34394d; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0; }
  </style>
  <script src="../../src/settings.js" defer></script>
  <script src="../../src/ambient-core.js" defer></script>
  <script src="../../src/streaming.js" defer></script>
  <script src="../../src/x-posts.js" defer></script>
  <script src="stream.js" defer></script>
  <script src="../../src/content.js" defer></script>
</head>
<body>
  <h1>Streaming player fixture</h1>
  <main>
    <div class="player"><video src="../../demo/assets/aurora.webm" autoplay muted loop playsinline controls aria-label="Main video"></video></div>
    <aside><h2>Chat controls</h2><button id="chat" type="button">Test chat control</button><p id="chat-count">0 clicks</p></aside>
  </main>
  <div class="controls">
    <button id="pause" type="button">Pause</button>
    <button id="replace" type="button">Replace video</button>
    <button id="hide" type="button">Hide player</button>
    <button id="resize" type="button">Resize player</button>
    <button id="enabled" type="button">Disable light</button>
    <label>Lighting area <select id="scope"><option value="page">Whole page</option><option value="post">Around player</option></select></label>
  </div>
</body>
</html>
