<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Popup localization fixture</title>
  <style>
    body { margin: 24px; background: #09090d; color: #ededf2; font: 16px system-ui, sans-serif; }
    main { display: flex; gap: 24px; align-items: flex-start; }
    iframe { display: block; width: 336px; height: 780px; border: 0; }
  </style>
  <script src="popup-preview.js" defer></script>
</head>
<body>
  <h1>Popup localization fixture</h1>
  <main>
    <section><h2>Español</h2><iframe title="Spanish popup" data-ui-language="es-AR"></iframe></section>
    <section><h2>English</h2><iframe title="English popup" data-ui-language="en-US"></iframe></section>
  </main>
</body>
</html>
